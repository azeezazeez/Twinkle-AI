# =========================================================
# SERVER
# =========================================================

server.port=${PORT:8080}

server.forward-headers-strategy=framework  


# =========================================================
# DATABASE - NEON POSTGRESQL
# =========================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# The schema is managed by src/main/resources/schema.sql (run it once on Neon).
# It is NOT executed at startup; Hibernate only validates that the tables match.
spring.sql.init.mode=never

# validate = fail fast if a table/column is missing. Never auto-alters the database.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.properties.hibernate.default_schema=public

# HikariCP
spring.datasource.hikari.pool-name=TwinkleHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
# Neon closes idle connections, so recycle/ping them before the server does.
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=60000


# =========================================================
# REDIS
# =========================================================

spring.data.redis.url=${REDIS_URL}

spring.data.redis.timeout=60000

# Spring Session stored in Redis
spring.session.store-type=redis
spring.session.redis.namespace=Twinkle:session
spring.session.redis.flush-mode=on-save
spring.session.timeout=24h


# =========================================================
# HTTP SESSION COOKIE
# =========================================================

server.servlet.session.cookie.max-age=${SESSION_COOKIE_MAX_AGE}
server.servlet.session.timeout=${SESSION_TIMEOUT}
server.servlet.session.cookie.name=TWINKLE_SESSION
server.servlet.session.cookie.http-only=${SESSION_COOKIE_HTTP_ONLY:true}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:None}
server.servlet.session.cookie.path=/


# =========================================================
# FRONTEND
# =========================================================

frontend.url=${FRONTEND_URL:https://twinkleai.vercel.app}

# Comma-separated list of allowed browser origins (CORS)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://twinkleai.vercel.app,https://nexus-smart-ai.vercel.app,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}


# =========================================================
# GOOGLE OAUTH 2.0
# =========================================================

oauth.google.client-id=${OAUTH_GOOGLE_CLIENT_ID}

oauth.google.client-secret=${OAUTH_GOOGLE_CLIENT_SECRET}

# Must point at the FRONTEND (Vercel) domain so the session cookie is set first-party via the /api proxy.
oauth.google.redirect-uri=${OAUTH_GOOGLE_REDIRECT_URI:${FRONTEND_URL:https://twinkleai.vercel.app}/api/auth/oauth/google/callback}

# Used for signing/verifying OAuth state
oauth.state-secret=${OAUTH_STATE_SECRET}


# =========================================================
# GROQ AI
# =========================================================

groq.api.key=${GROQ_API_KEY}

groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1}

groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

groq.models=${GROQ_MODELS:openai/gpt-oss-120b,openai/gpt-oss-20b,qwen/qwen3.8-27b}

groq.vision.models=${GROQ_VISION_MODELS:qwen/qwen3.8-27b}


# =========================================================
# CLOUDFLARE WORKERS AI
# =========================================================
# Secrets are read only from the environment (never commit real values).

cloudflare.account-id=${CLOUDFLARE_ACCOUNT_ID:}

cloudflare.api-token=${CLOUDFLARE_API_TOKEN:}

# Twinkle (general): gpt-oss-20b | Twinkle Pro (complex): gpt-oss-120b | Twinkle Live (lowest latency): llama-3.1-8b-instruct-fp8-fast
cloudflare.models=${CLOUDFLARE_MODELS:@cf/openai/gpt-oss-20b,@cf/openai/gpt-oss-120b,@cf/meta/llama-3.1-8b-instruct-fp8-fast}

# Tried in order when the selected model fails before producing output
cloudflare.fallback-models=${CLOUDFLARE_FALLBACK_MODELS:@cf/openai/gpt-oss-20b,@cf/meta/llama-3.1-8b-instruct-fp8-fast}

cloudflare.image.model=${CLOUDFLARE_IMAGE_MODEL:@cf/black-forest-labs/flux-1-schnell}

cloudflare.image.fallback-model=${CLOUDFLARE_IMAGE_FALLBACK_MODEL:@cf/black-forest-labs/flux-2-klein-4b}


# =========================================================
# GEMINI AI
# =========================================================

gemini.api.key=${GEMINI_API_KEY}

gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}

gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

gemini.live.model=${GEMINI_LIVE_MODEL:gemini-3.8-live}

gemini.max.output.tokens=${GEMINI_MAX_OUTPUT_TOKENS:16384}

gemini.thinking.level=${GEMINI_THINKING_LEVEL:low}


# =========================================================
# BREVO EMAIL
# =========================================================

brevo.api.key=${BREVO_API_KEY}

brevo.api.url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}

brevo.sender.email=${BREVO_SENDER_EMAIL}

brevo.sender.name=${BREVO_SENDER_NAME:Twinkle AI}


# =========================================================
# EMAIL
# =========================================================

email.sender=${EMAIL_SENDER}

email.sender.name=${EMAIL_SENDER_NAME:Twinkle AI}


# =========================================================
# OTP
# =========================================================

otp.expiration.minutes=${OTP_EXPIRATION_MINUTES:10}

otp.length=${OTP_LENGTH:6}


# =========================================================
# HTTP CLIENT
# =========================================================

http.connect.timeout=${HTTP_CONNECT_TIMEOUT:30000}

http.read.timeout=${HTTP_READ_TIMEOUT:60000}


# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:15MB}

spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:25MB}


# =========================================================
# JSON
# =========================================================

spring.jackson.serialization.write-dates-as-timestamps=false


# =========================================================
# LOGGING
# =========================================================

logging.level.root=INFO

logging.level.com.ai.chatbot_backend=INFO

# Useful during OAuth/session debugging
logging.level.org.springframework.session=INFO
logging.level.org.springframework.data.redis=INFO



# =========================================================
# TWINKLE AI RAG - GOOGLE GEMINI
# =========================================================

twinkle.rag.api-key=${TWINKLE_RAG_API_KEY:${GEMINI_API_KEY:}}
twinkle.rag.base-url=${TWINKLE_RAG_BASE_URL:${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}}
twinkle.rag.embedding-model=${TWINKLE_RAG_EMBEDDING_MODEL:gemini-embedding-001}
twinkle.rag.chat-model=${TWINKLE_RAG_CHAT_MODEL:${GEMINI_MODEL:gemini-3.8-flash}}


# =========================================================
# API DOCS (Swagger) - disabled unless explicitly enabled
# =========================================================

springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}


# =========================================================
# ACTUATOR - health only, no details
# =========================================================

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
