# ============================================================
# SERVER
# ============================================================

server.port=${PORT:8080}


# ============================================================
# DATABASE - NEON POSTGRESQL
# ============================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Optional but recommended for Neon
spring.datasource.hikari.pool-name=NeonHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# ============================================================
# REDIS / SPRING SESSION
# ============================================================

spring.data.redis.url=${REDIS_URL}

spring.session.store-type=redis
spring.session.redis.namespace=Twinkle:session
spring.session.redis.flush-mode=on-save
spring.session.timeout=24h

server.servlet.session.cookie.name=TWINKLE_SESSION
server.servlet.session.cookie.http-only=${SESSION_COOKIE_HTTP_ONLY:true}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:None}
server.servlet.session.cookie.path=/


# ============================================================
# FRONTEND
# ============================================================

frontend.url=${FRONTEND_URL:https://twinkleai.vercel.app}


# ============================================================
# GOOGLE OAUTH
# ============================================================

oauth.google.client-id=${OAUTH_GOOGLE_CLIENT_ID}
oauth.google.client-secret=${OAUTH_GOOGLE_CLIENT_SECRET}
oauth.google.redirect-uri=${OAUTH_GOOGLE_REDIRECT_URI}
oauth.state-secret=${OAUTH_STATE_SECRET}


# ============================================================
# GROQ
# ============================================================

groq.api.key=${GROQ_API_KEY}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1}

groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
groq.models=${GROQ_MODELS:openai/gpt-oss-120b,openai/gpt-oss-20b,qwen/qwen3.8-27b}
groq.vision.models=${GROQ_VISION_MODELS:qwen/qwen3.8-27b}


# ============================================================
# GEMINI
# ============================================================

gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}

gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
gemini.live.model=${GEMINI_LIVE_MODEL:gemini-3.8-live}

gemini.max.output.tokens=${GEMINI_MAX_OUTPUT_TOKENS:16384}
gemini.thinking.level=${GEMINI_THINKING_LEVEL:low}


# ============================================================
# BREVO EMAIL
# ============================================================

brevo.api.key=${BREVO_API_KEY}
brevo.api.url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}

brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=${BREVO_SENDER_NAME:Twinkle AI}


# ============================================================
# EMAIL
# ============================================================

email.sender=${EMAIL_SENDER}
email.sender.name=${EMAIL_SENDER_NAME:Twinkle AI}


# ============================================================
# OTP
# ============================================================

otp.expiration.minutes=${OTP_EXPIRATION_MINUTES:10}
otp.length=${OTP_LENGTH:6}


# ============================================================
# HTTP CLIENT
# ============================================================

http.connect.timeout=${HTTP_CONNECT_TIMEOUT:30000}
http.read.timeout=${HTTP_READ_TIMEOUT:60000}


# ============================================================
# FILE UPLOAD
# ============================================================

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:25MB}
