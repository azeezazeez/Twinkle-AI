# =========================================================
# TWINKLE AI - APPLICATION CONFIGURATION
# =========================================================


# =========================================================
# SERVER
# =========================================================

server.port=${PORT:8080}


# =========================================================
# SESSION
# =========================================================

server.servlet.session.cookie.name=TWINKLE_SESSION
server.servlet.session.cookie.http-only=${SESSION_COOKIE_HTTP_ONLY:true}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:None}
server.servlet.session.timeout=24h


# =========================================================
# GROQ - NORMAL TEXT CHAT
# =========================================================

groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1}

groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

groq.models=${GROQ_MODELS:openai/gpt-oss-120b,openai/gpt-oss-20b}

groq.vision.models=${GROQ_VISION_MODELS:qwen/qwen3.8-27b}


# =========================================================
# GEMINI - FILE / IMAGE / MEDIA UNDERSTANDING
# =========================================================

gemini.api.key=${GEMINI_API_KEY:}

gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}

gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:16384}

gemini.thinking-level=${GEMINI_THINKING_LEVEL:low}


# =========================================================
# GEMINI LIVE TALK
# =========================================================

gemini.live.model=${GEMINI_LIVE_MODEL:gemini-3.8-live}


# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}

spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:25MB}


# =========================================================
# POSTGRESQL / NEON DATABASE
# =========================================================

spring.datasource.url=${DB_URL:}

spring.datasource.username=${DB_USERNAME:}

spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# HIKARI CONNECTION POOL
# =========================================================

spring.datasource.hikari.connection-timeout=20000

spring.datasource.hikari.maximum-pool-size=5

spring.datasource.hikari.minimum-idle=0

spring.datasource.hikari.idle-timeout=120000

spring.datasource.hikari.max-lifetime=180000

spring.datasource.hikari.keepalive-time=60000

spring.datasource.hikari.pool-name=TwinkleHikariPool


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.default_schema=public

spring.jpa.show-sql=false

spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.jpa.properties.hibernate.format_sql=false


# =========================================================
# REDIS
# =========================================================

spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

spring.session.store-type=redis

spring.session.redis.namespace=Twinkle:session

spring.session.redis.flush-mode=on-save

spring.session.timeout=24h


# =========================================================
# BREVO EMAIL
# =========================================================

brevo.api.key=${BREVO_API_KEY:}

brevo.api.url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}

brevo.sender.email=${BREVO_SENDER_EMAIL:}

brevo.sender.name=${BREVO_SENDER_NAME:Twinkle AI}


# =========================================================
# EMAIL
# =========================================================

email.sender.email=${EMAIL_SENDER:}

email.sender.name=${EMAIL_SENDER_NAME:Twinkle AI}


# =========================================================
# OTP
# =========================================================

otp.expiration.minutes=${OTP_EXPIRATION_MINUTES:10}

otp.length=${OTP_LENGTH:6}


# =========================================================
# HTTP CLIENT
# =========================================================

http.connect.timeout=${HTTP_CONNECT_TIMEOUT:30000}

http.read.timeout=${HTTP_READ_TIMEOUT:60000}


# =========================================================
# FRONTEND
# =========================================================

frontend.url=${FRONTEND_URL:}


# =========================================================
# GOOGLE OAUTH
# =========================================================

oauth.google.client-id=${OAUTH_GOOGLE_CLIENT_ID:}

oauth.google.client-secret=${OAUTH_GOOGLE_CLIENT_SECRET:}

oauth.google.redirect-uri=${OAUTH_GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/oauth/google/callback}


# =========================================================
# OAUTH STATE
# =========================================================

oauth.state-secret=${OAUTH_STATE_SECRET:}


# =========================================================
# LOGGING
# =========================================================

logging.level.com.ai.chatbot_backend=INFO

logging.level.org.springframework.web=INFO

logging.level.org.springframework.boot=INFO

logging.level.org.springframework.session=INFO


# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=when_authorized
