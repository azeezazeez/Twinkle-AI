# ============================================================
# Twinkle AI - APPLICATION CONFIGURATION
# ============================================================

# ==================== SERVER ====================

server.port=${PORT:8080}


# ==================== SESSION ====================

server.servlet.session.timeout=24h
server.servlet.session.cookie.name=NEXUS_SESSION
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true


# ==================== GROQ AI ====================

groq.api.key=${GROQ_API_KEY}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1}

# Default model
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

# Exactly three supported models
groq.models=${GROQ_MODELS:openai/gpt-oss-120b,openai/gpt-oss-20b,qwen/qwen3.8-27b}

# Exactly one vision model
groq.vision.models=${GROQ_VISION_MODELS:qwen/qwen3.8-27b}


# ==================== FILE UPLOADS ====================

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:25MB}


# ==================== POSTGRESQL / NEON ====================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ==================== HIKARI CONNECTION POOL ====================

spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.pool-name=NeonHikariPool


# ==================== JPA / HIBERNATE ====================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.format_sql=false


# ==================== REDIS ====================

spring.data.redis.url=${REDIS_URL}

spring.session.store-type=redis
spring.session.redis.namespace=nexus:session
spring.session.timeout=24h


# ==================== BREVO REST API ====================

brevo.api.key=${BREVO_API_KEY}
brevo.api.url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}

brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=${BREVO_SENDER_NAME:Twinkle AI}


# ==================== EMAIL SENDER ====================

email.sender.email=${EMAIL_SENDER}
email.sender.name=${EMAIL_SENDER_NAME:Twinkle AI}


# ==================== OTP ====================

otp.expiration.minutes=${OTP_EXPIRATION_MINUTES:10}
otp.length=${OTP_LENGTH:6}


# ==================== HTTP ====================

http.connect.timeout=${HTTP_CONNECT_TIMEOUT:30000}
http.read.timeout=${HTTP_READ_TIMEOUT:60000}


# ==================== LOGGING ====================

logging.level.com.ai.chatbot_backend=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot=INFO